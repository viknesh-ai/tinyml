# Hand-edited chip catalog (PRD section 8), until the chip catalog API replaces this file.
# Memory sizes, cores, clocks and radios are datasheet values. Prices are rough 1k-unit chip prices and
# currents are rounded datasheet typicals (active: CPU running from flash at full clock, radio off;
# sleep: the lowest mode that keeps RAM and a timer running). Both are always shown as "estimated".

catalog:
  version: "2026.10"
  source: Hand-collected from vendor datasheets and product pages, October 2026

vendors:
  - id: espressif
    name: Espressif
    summary: Wi-Fi and Bluetooth chips with lots of RAM; the usual choice for connected products.
  - id: st
    name: STMicroelectronics
    summary: The widest STM32 range, from 40-cent Cortex-M0+ parts to 480 MHz Cortex-M7.
  - id: nordic
    name: Nordic Semiconductor
    summary: Bluetooth LE specialists with very low run and sleep current.
  - id: raspberrypi
    name: Raspberry Pi
    summary: Cheap, fast dual-core chips with external flash.
  - id: nxp
    name: NXP
    summary: High-performance Cortex-M33 and crossover Cortex-M7 parts.
  - id: microchip
    name: Microchip
    summary: SAM D Cortex-M0+ and M4F chips, common on Arduino and Adafruit boards.
  - id: silabs
    name: Silicon Labs
    summary: Low-power Bluetooth LE, Thread and Zigbee radios.
  - id: ti
    name: Texas Instruments
    summary: SimpleLink wireless chips for Bluetooth LE, Thread and Zigbee.
  - id: renesas
    name: Renesas
    summary: RA family Cortex-M4F, used on the Arduino Uno R4.

cores:
  xtensa-lx7f:
    arch: xtensa
    fpu: single
    description: Xtensa LX7 with single-precision FPU
  xtensa-lx6f:
    arch: xtensa
    fpu: single
    description: Xtensa LX6 with single-precision FPU
  rv32imc:
    arch: riscv
    fpu: none
    description: RISC-V RV32IMC, no FPU
  cortex-m4f:
    arch: arm
    fpu: single
    gcc_flags: [-mcpu=cortex-m4, -mthumb, -mfpu=fpv4-sp-d16, -mfloat-abi=hard]
    qemu_machine: mps2-an386
    description: Arm Cortex-M4 with single-precision FPU
  cortex-m4:
    arch: arm
    fpu: none
    gcc_flags: [-mcpu=cortex-m4, -mthumb, -mfloat-abi=soft]
    qemu_machine: mps2-an386
    description: Arm Cortex-M4 without FPU
  cortex-m33f:
    arch: arm
    fpu: single
    gcc_flags: [-mcpu=cortex-m33, -mthumb, -mfpu=fpv5-sp-d16, -mfloat-abi=hard]
    qemu_machine: mps2-an505
    description: Arm Cortex-M33 with single-precision FPU
  cortex-m7f:
    arch: arm
    fpu: double
    gcc_flags: [-mcpu=cortex-m7, -mthumb, -mfpu=fpv5-d16, -mfloat-abi=hard]
    qemu_machine: mps2-an500
    description: Arm Cortex-M7 with double-precision FPU
  cortex-m0plus:
    arch: arm
    fpu: none
    gcc_flags: [-mcpu=cortex-m0plus, -mthumb, -mfloat-abi=soft]
    qemu_machine: mps2-an385
    description: Arm Cortex-M0+, no FPU
  rv32imc-generic:
    arch: riscv
    fpu: none
    gcc_flags: [-march=rv32imc, -mabi=ilp32]
    qemu_machine: virt
    description: RISC-V RV32IMC core on the QEMU virt board

